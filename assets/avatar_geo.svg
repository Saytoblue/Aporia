<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- background circle with gradient -->
  <defs>
    <radialGradient id="bgGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </radialGradient>
    <linearGradient id="shape1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A90D9"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="shape2Grad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="shape3Grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!-- outer ring -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)"/>
  <circle cx="200" cy="200" r="190" fill="none" stroke="url(#ringGrad)" stroke-width="3" opacity="0.6"/>
  <circle cx="200" cy="200" r="174" fill="none" stroke="url(#ringGrad)" stroke-width="1" opacity="0.2"/>

  <!-- outer orbit -->
  <circle cx="200" cy="200" r="148" fill="none" stroke="#3B82F6" stroke-width="1.5" opacity="0.15" stroke-dasharray="8 16"/>

  <!-- central geometric form: rotated squares / diamonds -->
  <!-- largest rotated square -->
  <rect x="100" y="100" width="200" height="200" rx="8"
        fill="none" stroke="#4A90D9" stroke-width="2.5" opacity="0.5"
        transform="rotate(45 200 200)"/>

  <!-- mid rotated square -->
  <rect x="128" y="128" width="144" height="144" rx="6"
        fill="url(#shape1Grad)" opacity="0.25"
        transform="rotate(45 200 200)"/>
  <rect x="128" y="128" width="144" height="144" rx="6"
        fill="none" stroke="#60A5FA" stroke-width="2" opacity="0.6"
        transform="rotate(45 200 200)"/>

  <!-- inner rotated square -->
  <rect x="152" y="152" width="96" height="96" rx="5"
        fill="url(#shape2Grad)" opacity="0.35"
        transform="rotate(45 200 200)"/>
  <rect x="152" y="152" width="96" height="96" rx="5"
        fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.7"
        transform="rotate(45 200 200)"/>

  <!-- core diamond -->
  <rect x="172" y="172" width="56" height="56" rx="4"
        fill="url(#shape3Grad)" opacity="0.5"
        transform="rotate(45 200 200)"/>
  <rect x="172" y="172" width="56" height="56" rx="4"
        fill="none" stroke="#93C5FD" stroke-width="2" opacity="0.8"
        transform="rotate(45 200 200)"/>

  <!-- center dot -->
  <circle cx="200" cy="200" r="6" fill="#E0F2FE" opacity="0.9"/>

  <!-- corner accent nodes -->
  <circle cx="200" cy="56" r="5" fill="#38BDF8" opacity="0.7"/>
  <circle cx="200" cy="344" r="5" fill="#38BDF8" opacity="0.7"/>
  <circle cx="56" cy="200" r="5" fill="#38BDF8" opacity="0.7"/>
  <circle cx="344" cy="200" r="5" fill="#38BDF8" opacity="0.7"/>

  <!-- diagonal connector lines -->
  <line x1="200" y1="62" x2="200" y2="108" stroke="#38BDF8" stroke-width="1" opacity="0.25"/>
  <line x1="200" y1="292" x2="200" y2="338" stroke="#38BDF8" stroke-width="1" opacity="0.25"/>
  <line x1="62" y1="200" x2="108" y2="200" stroke="#38BDF8" stroke-width="1" opacity="0.25"/>
  <line x1="292" y1="200" x2="338" y2="200" stroke="#38BDF8" stroke-width="1" opacity="0.25"/>

  <!-- small orbiting dots -->
  <circle cx="200" cy="58" r="3" fill="#93C5FD" opacity="0.8"/>
  <circle cx="342" cy="200" r="3" fill="#93C5FD" opacity="0.8"/>
  <circle cx="200" cy="342" r="3" fill="#93C5FD" opacity="0.8"/>
  <circle cx="58" cy="200" r="3" fill="#93C5FD" opacity="0.8"/>

  <!-- subtle diagonal crosses at 45deg -->
  <circle cx="259" cy="141" r="3.5" fill="#60A5FA" opacity="0.5"/>
  <circle cx="141" cy="259" r="3.5" fill="#60A5FA" opacity="0.5"/>
  <circle cx="141" cy="141" r="3.5" fill="#60A5FA" opacity="0.5"/>
  <circle cx="259" cy="259" r="3.5" fill="#60A5FA" opacity="0.5"/>
</svg>
